<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Animastor — Documentation</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <script>
    (function () {
      try {
        var PREFS = 'animastor_settings';
        var p = localStorage.getItem(PREFS) ? JSON.parse(localStorage.getItem(PREFS)) : {};
        var theme = p.theme || 'auto';
        var resolved = theme === 'auto'
          ? (new Date().getHours() >= 6 && new Date().getHours() <= 19 ? 'light' : 'dark')
          : theme;
        document.documentElement.setAttribute('data-theme', resolved);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/docs-browser.css">
</head>
<body>

  <header class="header">
    <div class="site header__inner">
      <a class="header__brand" href="/">
        <img class="header__logo" src="/logo.png" alt="">
        Animastor
      </a>
      <nav class="header__nav" aria-label="Main">
        <a class="header__link" href="/">Home</a>
        <a class="header__link" href="/#how-to-use">How to use</a>
        <a class="header__link" href="/#android">Android</a>
        <a class="btn btn--sm" href="https://app.animastor.in/">Open App</a>
      </nav>
    </div>
  </header>

  <div class="docs-layout">
    <button class="docs-sidebar-toggle" id="docs-sidebar-toggle" type="button" aria-label="Toggle sidebar">
      <span class="docs-sidebar-toggle__icon">&#9776;</span>
    </button>

    <aside class="docs-sidebar">
      <div class="docs-sidebar__header">Documentation</div>
      <div class="docs-tree" id="docs-tree"></div>
    </aside>

    <main class="docs-main">
      <nav class="docs-breadcrumb" id="docs-breadcrumb"></nav>
      <div class="docs-content" id="docs-content">
        <p>Loading...</p>
      </div>
    </main>
  </div>

  <div class="modal-backdrop" id="auth-backdrop" hidden></div>

  <script src="/site.js"></script>
  <script src="/docs-browser.js"></script>
</body>
</html>
