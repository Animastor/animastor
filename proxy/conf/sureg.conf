# sureg.dev — optional domain (separate from Animastor deployment).
# Only served when SUREG_SITE_DIR is set in .env and points to a valid site directory.
# On a fresh Animastor deployment without sureg.dev, this file is harmless:
# nginx loads it but the /usr/share/nginx/sureg root serves 404s.

server {
    listen 80;
    server_name sureg.dev www.sureg.dev;

    # ACME HTTP-01 challenge (Let's Encrypt webroot)
    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/sureg;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {

    listen 443 ssl;
    server_name sureg.dev www.sureg.dev;

    ssl_certificate     /etc/letsencrypt/live/sureg.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sureg.dev/privkey.pem;

    root /usr/share/nginx/sureg;
    index index.html;
}
