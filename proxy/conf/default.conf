resolver 127.0.0.11 ipv6=off valid=30s;

# ======================================================
# UPSTREAMS (динамический DNS через resolve)
# ======================================================

upstream backend_upstream {
    server animastor-backend:3000 resolve;
    zone backend 64k;
    keepalive 32;
}

upstream gpu_hub_upstream {
    server gpu-hub:5000 resolve;
    zone gpu-hub 64k;
    keepalive 32;
}

# ======================================================
# HTTP → HTTPS (все домены animastor.in)
# ======================================================

server {
    listen 80;
    server_name animastor.in www.animastor.in app.animastor.in admin.animastor.in;

    # ACME HTTP-01 challenge (Let's Encrypt webroot)
    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/frontends/website;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ======================================================
# HTTPS — PUBLIC WEBSITE animastor.in / www.animastor.in
# Landing, документация, публичная Library, net-disk.
# БЕЗ Basic Auth — публичный сайт не зависит от размера экрана.
# ======================================================

server {

    listen 443 ssl http2;
    server_name animastor.in www.animastor.in;

    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/animastor.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/animastor.in/privkey.pem;

    root /usr/share/nginx/frontends/website;
    index index.html;

    client_max_body_size 100m;

    keepalive_timeout 65;

    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    proxy_next_upstream error timeout http_502 http_503 http_504;

    # --------------------------------------------------
    # HEALTH
    # --------------------------------------------------

    location /health {
        proxy_pass http://backend_upstream/health;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # --------------------------------------------------
    # BACKEND API (динамический DNS через upstream resolve)
    # --------------------------------------------------

    location /api/ {

        proxy_pass http://backend_upstream;

        proxy_http_version 1.1;

        proxy_set_header Connection "";
        proxy_buffering off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Auth MVP: backend needs the scheme to decide the Secure cookie flag.
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------
    # GPU HUB (динамический DNS через upstream resolve)
    # --------------------------------------------------

    location /gpu/ {

        proxy_pass http://gpu_hub_upstream/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

   # --------------------------------------------------
   # NET DISK
   # --------------------------------------------------
    
    location /net-disk/ {
    
        alias /net-disk/;
    
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    
        types {
            application/vnd.android.package-archive apk;
        }
    
        add_header Cache-Control "no-cache";
    }

    # --------------------------------------------------
    # BLOCK INTERNAL
    # --------------------------------------------------

    location = /result { return 403; }
    location = /worker/error { return 403; }

    # --------------------------------------------------
    # PUBLIC LIBRARY — часть публичного сайта. Файл отдаётся
    # напрямую (без редиректа /library → /library/ — это портило
    # бы URL в iframe приложения).
    # --------------------------------------------------

    location = /library {
        try_files /library/index.html =404;
    }

    # --------------------------------------------------
    # FRONTEND (static website) — без auth
    # --------------------------------------------------

    location / {
        try_files $uri $uri/ =404;
    }
}

# ======================================================
# HTTPS — APPLICATION app.animastor.in
# Единое responsive-приложение (MobileShell / DesktopShell).
# Весь frontend закрыт существующим Basic Auth, КРОМЕ /library.
# ======================================================

server {

    listen 443 ssl http2;
    server_name app.animastor.in;

    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/animastor.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/animastor.in/privkey.pem;

    root /usr/share/nginx/frontends/app/dist;
    index index.html;

    client_max_body_size 100m;

    keepalive_timeout 65;

    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    proxy_next_upstream error timeout http_502 http_503 http_504;

    # --------------------------------------------------
    # HEALTH
    # --------------------------------------------------

    location /health {
        proxy_pass http://backend_upstream/health;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # --------------------------------------------------
    # BACKEND API
    # --------------------------------------------------

    location /api/ {

        proxy_pass http://backend_upstream;

        proxy_http_version 1.1;

        proxy_set_header Connection "";
        proxy_buffering off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Auth MVP: backend needs the scheme to decide the Secure cookie flag.
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------
    # GPU HUB
    # --------------------------------------------------

    location /gpu/ {

        proxy_pass http://gpu_hub_upstream/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

   # --------------------------------------------------
   # NET DISK
   # --------------------------------------------------
    
    location /net-disk/ {
    
        alias /net-disk/;
    
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    
        types {
            application/vnd.android.package-archive apk;
        }
    
        add_header Cache-Control "no-cache";
    }

    # --------------------------------------------------
    # BLOCK INTERNAL
    # --------------------------------------------------

    location = /result { return 403; }
    location = /worker/error { return 403; }

    # --------------------------------------------------
    # PUBLIC LIBRARY — единственный путь без Basic Auth.
    # Содержимое берём из публичного сайта (frontends/website/library),
    # а НЕ из SPA dist. Точный location = /library (без $uri/, без
    # SPA-fallback) гарантирует, что исключение не открывает приложение:
    # app.animastor.in/... — auth, app.animastor.in/library — public.
    # --------------------------------------------------

    location = /library {
        auth_basic off;
        alias /usr/share/nginx/frontends/website/library/index.html;
        default_type text/html;
    }

    # --------------------------------------------------
    # FRONTEND (SPA) — всё приложение закрыто Basic Auth
    # (тот же .htpasswd, что и раньше)
    # --------------------------------------------------

    location / {
        auth_basic "Animastor - restricted access";
        auth_basic_user_file /etc/nginx/.htpasswd;
        # SPA fallback: history-mode routes (/settings, /play, ...) → index.html
        try_files $uri $uri/ /index.html;
    }
}

# ======================================================
# HTTPS — ADMIN admin.animastor.in
# Admin Foundation: the SAME SPA dist as app.animastor.in, but the root
# redirects to /admin and the whole host sits behind Basic Auth (a second
# layer on top of the backend requireAdmin guard). The main application on
# app.animastor.in is NOT opened by this block.
# ======================================================

server {

    listen 443 ssl http2;
    server_name admin.animastor.in;

    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/animastor.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/animastor.in/privkey.pem;

    root /usr/share/nginx/frontends/app/dist;
    index index.html;

    client_max_body_size 100m;

    keepalive_timeout 65;

    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    proxy_next_upstream error timeout http_502 http_503 http_504;

    # Everything on the admin host requires Basic Auth.
    auth_basic "Animastor Admin - restricted access";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # --------------------------------------------------
    # HEALTH
    # --------------------------------------------------

    location /health {
        proxy_pass http://backend_upstream/health;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # --------------------------------------------------
    # BACKEND API
    # --------------------------------------------------

    location /api/ {

        proxy_pass http://backend_upstream;

        proxy_http_version 1.1;

        proxy_set_header Connection "";
        proxy_buffering off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Auth MVP: backend needs the scheme to decide the Secure cookie flag.
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------
    # ROOT → /admin (the SPA admin page)
    # --------------------------------------------------

    location = / {
        return 302 /admin;
    }

    # --------------------------------------------------
    # FRONTEND (SPA) — serve the app dist; /admin falls back to index.html
    # --------------------------------------------------

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ======================================================
# m.animastor.in — ВЫВЕДЕН ИЗ ЭКСПЛУАТАЦИИ 2026-08-12
# (удалён из DNS; сертификат перевыпущен без этого SAN).
# ======================================================

# ======================================================
# SUREG.DEV
# ======================================================

server {
    listen 80;
    server_name sureg.dev www.sureg.dev;

    # ACME HTTP-01 challenge (Let's Encrypt webroot)
    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/sureg;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {

    listen 443 ssl;
    server_name sureg.dev www.sureg.dev;

    ssl_certificate     /etc/letsencrypt/live/sureg.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sureg.dev/privkey.pem;

    root /usr/share/nginx/sureg;
    index index.html;
}

