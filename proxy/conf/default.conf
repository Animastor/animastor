resolver 127.0.0.11 ipv6=off valid=30s;

# ======================================================
# UPSTREAMS (динамический DNS через resolve)
# ======================================================

upstream backend_upstream {
    server animastor-backend:3000 resolve;
    zone backend 64k;
    keepalive 32;
}

upstream gpu_hub_upstream {
    server gpu-hub:5000 resolve;
    zone gpu-hub 64k;
    keepalive 32;
}

# ======================================================
# HTTP → HTTPS
# ======================================================

server {
    listen 80;
    server_name animastor.in www.animastor.in m.animastor.in;

    # ACME HTTP-01 challenge (Let's Encrypt webroot)
    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/frontends/main;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ======================================================
# HTTPS — MAIN (desktop) animastor.in / www.animastor.in
# ======================================================

server {

    listen 443 ssl http2;
    server_name animastor.in www.animastor.in;

    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/animastor.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/animastor.in/privkey.pem;

    root /usr/share/nginx/frontends/main;
    index index.html;

    client_max_body_size 100m;

    keepalive_timeout 65;

    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    proxy_next_upstream error timeout http_502 http_503 http_504;

    # --------------------------------------------------
    # HEALTH
    # --------------------------------------------------

    location /health {
        proxy_pass http://backend_upstream/health;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # --------------------------------------------------
    # BACKEND API (динамический DNS через upstream resolve)
    # --------------------------------------------------

    location /api/ {

        proxy_pass http://backend_upstream;

        proxy_http_version 1.1;

        proxy_set_header Connection "";
        proxy_buffering off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # --------------------------------------------------
    # GPU HUB (динамический DNS через upstream resolve)
    # --------------------------------------------------

    location /gpu/ {

        proxy_pass http://gpu_hub_upstream/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

   # --------------------------------------------------
   # NET DISK
   # --------------------------------------------------
    
    location /net-disk/ {
    
        alias /net-disk/;
    
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    
        types {
            application/vnd.android.package-archive apk;
        }
    
        add_header Cache-Control "no-cache";
    }

    # --------------------------------------------------
    # BLOCK INTERNAL
    # --------------------------------------------------

    location = /result { return 403; }
    location = /worker/error { return 403; }

    # --------------------------------------------------
    # PUBLIC LIBRARY — единственный публичный путь на сайте.
    # Без Basic Auth (auth_basic off): открыт ровно один роут = /library,
    # всё остальное закрыто в location / ниже. SPA-fallback здесь НЕТ —
    # основной домен отдаёт статику, поэтому исключение не открывает frontend.
    # --------------------------------------------------

    location = /library {
        auth_basic off;
        # NB: явный путь к ФАЙЛУ, а не $uri $uri/ — ветка $uri/ для каталога
        # делает internal redirect на /library/ и повторно матчит location /
        # (auth_basic) → /library потребовал бы пароль. Файл отдаётся
        # в текущем контексте, без редиректа.
        try_files /library/index.html =404;
    }

    # --------------------------------------------------
    # FRONTEND (desktop) — весь сайт закрыт Basic Auth
    # (тот же .htpasswd, что и на m.animastor.in)
    # --------------------------------------------------

    location / {
        auth_basic "Animastor - restricted access";
        auth_basic_user_file /etc/nginx/.htpasswd;
        try_files $uri $uri/ =404;
    }
}

# ======================================================
# HTTPS — MOBILE m.animastor.in
# (временная защита Basic Auth до завершения разработки)
# ======================================================

server {

    listen 443 ssl http2;
    server_name m.animastor.in;

    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/animastor.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/animastor.in/privkey.pem;

    root /usr/share/nginx/frontends/mobile/dist;
    index index.html;

    client_max_body_size 100m;

    keepalive_timeout 65;

    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    proxy_next_upstream error timeout http_502 http_503 http_504;

    # --------------------------------------------------
    # HEALTH
    # --------------------------------------------------

    location /health {
        proxy_pass http://backend_upstream/health;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # --------------------------------------------------
    # BACKEND API
    # --------------------------------------------------

    location /api/ {

        proxy_pass http://backend_upstream;

        proxy_http_version 1.1;

        proxy_set_header Connection "";
        proxy_buffering off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # --------------------------------------------------
    # GPU HUB
    # --------------------------------------------------

    location /gpu/ {

        proxy_pass http://gpu_hub_upstream/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

   # --------------------------------------------------
   # NET DISK
   # --------------------------------------------------
    
    location /net-disk/ {
    
        alias /net-disk/;
    
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    
        types {
            application/vnd.android.package-archive apk;
        }
    
        add_header Cache-Control "no-cache";
    }

    # --------------------------------------------------
    # BLOCK INTERNAL
    # --------------------------------------------------

    location = /result { return 403; }
    location = /worker/error { return 403; }

    # --------------------------------------------------
    # FRONTEND (mobile) — защищено Basic Auth
    # --------------------------------------------------

    location / {
        auth_basic "Animastor - restricted access";
        auth_basic_user_file /etc/nginx/.htpasswd;
        # SPA fallback: history-mode routes (/settings, /play, ...) → index.html
        try_files $uri $uri/ /index.html;
    }
}

# ======================================================
# SUREG.DEV
# ======================================================

server {
    listen 80;
    server_name sureg.dev www.sureg.dev;

    # ACME HTTP-01 challenge (Let's Encrypt webroot)
    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/sureg;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {

    listen 443 ssl;
    server_name sureg.dev www.sureg.dev;

    ssl_certificate     /etc/letsencrypt/live/sureg.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sureg.dev/privkey.pem;

    root /usr/share/nginx/sureg;
    index index.html;
}

