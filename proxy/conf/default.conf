resolver 127.0.0.11 ipv6=off valid=30s;

# ======================================================
# UPSTREAMS (динамический DNS через resolve)
# ======================================================

upstream backend_upstream {
    server animastor-backend:3000 resolve;
    zone backend 64k;
    keepalive 32;
}

upstream gpu_hub_upstream {
    server gpu-hub:5000 resolve;
    zone gpu-hub 64k;
    keepalive 32;
}

# ======================================================
# HTTP → HTTPS (все домены animastor.in)
# ======================================================

server {
    listen 80;
    server_name animastor.in www.animastor.in app.animastor.in admin.animastor.in;

    # ACME HTTP-01 challenge (Let's Encrypt webroot)
    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/frontends/website;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ======================================================
# HTTPS — PUBLIC WEBSITE animastor.in / www.animastor.in
# Landing, документация, публичная Library.
# Public website — no Basic Auth. The application at app.animastor.in
# still has its own authentication layer.
# ======================================================

server {

    listen 443 ssl http2;
    server_name animastor.in www.animastor.in;

    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/animastor.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/animastor.in/privkey.pem;

    root /usr/share/nginx/frontends/website;
    index index.html;

    client_max_body_size 100m;

    keepalive_timeout 65;

    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    proxy_next_upstream error timeout http_502 http_503 http_504;

    # --------------------------------------------------
    # HEALTH
    # --------------------------------------------------

    location /health {
        proxy_pass http://backend_upstream/health;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # --------------------------------------------------
    # BACKEND API (динамический DNS через upstream resolve)
    # --------------------------------------------------

    location /api/ {

        proxy_pass http://backend_upstream;

        proxy_http_version 1.1;

        proxy_set_header Connection "";
        proxy_buffering off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Auth MVP: backend needs the scheme to decide the Secure cookie flag.
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------
    # GPU HUB (динамический DNS через upstream resolve)
    # --------------------------------------------------

    location /gpu/ {

        proxy_pass http://gpu_hub_upstream/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # --------------------------------------------------
    # BLOCK INTERNAL
    # --------------------------------------------------

    location = /result { return 403; }
    location = /worker/error { return 403; }

    # --------------------------------------------------
    # PUBLIC LIBRARY — часть публичного сайта. Файл отдаётся
    # напрямую (без редиректа /library → /library/ — это портило
    # бы URL в iframe приложения).
    # --------------------------------------------------

    location = /library {
        try_files /library/index.html =404;
    }

    # --------------------------------------------------
    # PUBLIC DOCS — documentation browser + read-only markdown tree.
    # Bind mount ./docs → /usr/share/nginx/docs.
    # SPA at /docs/index.html handles hash-routed navigation;
    # direct links to .md files still served as plain text.
    # --------------------------------------------------

    # Docs browser root — serve SPA shell
    location = /docs/ {
        root /usr/share/nginx;
        try_files /docs/index.html =404;
    }

    # Docs browser entry point (for direct URL access)
    location = /docs/index.html {
        root /usr/share/nginx;
        charset utf-8;
    }

    # Docs browser assets
    location = /docs/docs-browser.js {
        root /usr/share/nginx;
        charset utf-8;
        default_type application/javascript;
    }
    location = /docs/docs-browser.css {
        root /usr/share/nginx;
        charset utf-8;
        default_type text/css;
    }

    # All other docs files: markdown tree served as plain text
    location /docs/ {
        root /usr/share/nginx;
        default_type text/plain;
        charset utf-8;
        autoindex off;
        try_files $uri/README.md $uri =404;
    }

    # --------------------------------------------------
    # DOWNLOADS — APK distribution (release artifacts)
    # Served from frontends/website/downloads/ (bind-mounted).
    # --------------------------------------------------

    location /downloads/ {
        root /usr/share/nginx/frontends/website;
        autoindex off;
        add_header Content-Disposition "attachment" always;
    }

    # --------------------------------------------------
    # FRONTEND (static website) — без auth
    # --------------------------------------------------

    location / {
        try_files $uri $uri/ =404;
    }
}

# ======================================================
# HTTPS — APPLICATION app.animastor.in
# Единое responsive-приложение (MobileShell / DesktopShell).
# Frontend открыт — пользователи логинятся через собственную форму
# приложения (backend auth). nginx Basic Auth снят; backend-аутентификация
# остаётся единственным слоем защиты.
# ======================================================

server {

    listen 443 ssl http2;
    server_name app.animastor.in;

    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/animastor.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/animastor.in/privkey.pem;

    root /usr/share/nginx/frontends/app/dist;
    index index.html;

    client_max_body_size 100m;

    keepalive_timeout 65;

    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    proxy_next_upstream error timeout http_502 http_503 http_504;

    # --------------------------------------------------
    # HEALTH
    # --------------------------------------------------

    location /health {
        proxy_pass http://backend_upstream/health;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # --------------------------------------------------
    # BACKEND API
    # --------------------------------------------------

    location /api/ {

        proxy_pass http://backend_upstream;

        proxy_http_version 1.1;

        proxy_set_header Connection "";
        proxy_buffering off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Auth MVP: backend needs the scheme to decide the Secure cookie flag.
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------
    # GPU HUB
    # --------------------------------------------------

    location /gpu/ {

        proxy_pass http://gpu_hub_upstream/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # --------------------------------------------------
    # BLOCK INTERNAL
    # --------------------------------------------------

    location = /result { return 403; }
    location = /worker/error { return 403; }

    # --------------------------------------------------
    # PUBLIC LIBRARY — публичная страница библиотеки.
    # Содержимое берём из публичного сайта (frontends/website/library),
    # а НЕ из SPA dist. Точный location = /library (без $uri/, без
    # SPA-fallback) гарантирует, что он не пересекается с приложением.
    # --------------------------------------------------

    location = /library {
        alias /usr/share/nginx/frontends/website/library/index.html;
        default_type text/html;
    }

    # --------------------------------------------------
    # FRONTEND (SPA) — открыт. Пользователи логинятся через собственную
    # форму приложения (backend auth).
    # --------------------------------------------------

    location / {
        # SPA fallback: history-mode routes (/settings, /play, ...) → index.html
        try_files $uri $uri/ /index.html;
    }
}

# ======================================================
# HTTPS — ADMIN admin.animastor.in
# Admin Foundation: the SAME SPA dist as app.animastor.in, but the root
# redirects to /admin and the whole host sits behind Basic Auth (a second
# layer on top of the backend requireAdmin guard). The main application on
# app.animastor.in is NOT opened by this block.
# ======================================================

server {

    listen 443 ssl http2;
    server_name admin.animastor.in;

    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/animastor.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/animastor.in/privkey.pem;

    root /usr/share/nginx/frontends/app/dist;
    index index.html;

    client_max_body_size 100m;

    keepalive_timeout 65;

    proxy_connect_timeout 60s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;

    proxy_next_upstream error timeout http_502 http_503 http_504;

    # Basic Auth removed — admin uses internal app login (requireAdmin).

    # --------------------------------------------------
    # HEALTH
    # --------------------------------------------------

    location /health {
        proxy_pass http://backend_upstream/health;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # --------------------------------------------------
    # BACKEND API
    # --------------------------------------------------

    location /api/ {

        proxy_pass http://backend_upstream;

        proxy_http_version 1.1;

        proxy_set_header Connection "";
        proxy_buffering off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Auth MVP: backend needs the scheme to decide the Secure cookie flag.
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------
    # ROOT → /admin (the SPA admin page)
    # --------------------------------------------------

    location = / {
        return 302 /admin;
    }

    # --------------------------------------------------
    # FRONTEND (SPA) — serve the app dist; /admin falls back to index.html
    # --------------------------------------------------

    location / {
        try_files $uri $uri/ /index.html;
    }
}

