resolver 127.0.0.11 ipv6=off valid=30s;

server {
    listen 80;
    server_name animastor.in www.animastor.in;

    return 301 https://$host$request_uri;
}

server {

    listen 443 ssl;
    server_name animastor.in www.animastor.in;

    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/animastor.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/animastor.in/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100m;

    keepalive_timeout 65;
    proxy_connect_timeout 60;
    proxy_read_timeout 600;
    proxy_send_timeout 600;

    # -------------------------
    # HEALTH
    # -------------------------

    location /health {

        proxy_pass http://backend:3000/health;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

    }

    # -------------------------
    # GPU HUB
    # -------------------------

    location /gpu/ {

        proxy_pass http://gpu-hub:5000/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_connect_timeout 60s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

    }

    # -------------------------
    # BACKEND API
    # -------------------------

    location /api/ {

        proxy_pass http://backend:3000/;

        proxy_http_version 1.1;

        proxy_set_header Connection "";
        proxy_buffering off;

        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    }

    # -------------------------
    # BLOCK INTERNAL ENDPOINTS
    # -------------------------

    location = /result {
        return 403;
    }

    location = /worker/error {
        return 403;
    }

    # -------------------------
    # FRONTEND
    # -------------------------

    location / {

        try_files $uri $uri/ =404;

    }

}
