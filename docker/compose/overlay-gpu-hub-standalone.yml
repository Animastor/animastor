# ============================================================
# GPU Hub standalone image cutover (Phase 10J / 10T)
# ============================================================
# Use when GPU_HUB_IMAGE is set to a pinned GHCR digest.
# The GHCR image contains baked-in artifacts (Phase 10T).
#
# Usage:
#   docker compose \
#     -f docker-compose.yml \
#     -f docker/compose/overlay-gpu-hub-standalone.yml \
#     up -d gpu-hub
#
# RULES:
#   - NEVER use a moving tag. Pin by digest or immutable version tag.
#   - Set GPU_HUB_IMAGE in .env first, e.g.:
#       GPU_HUB_IMAGE=ghcr.io/animastor/animastor-gpu-hub@sha256:<digest>
#   - The GHCR image contains baked-in artifacts (worker bundle,
#     workflows, installer, manifests) at /app/artifacts/.
#   - No bind mounts needed — the image is self-contained.
#
# This overlay intentionally does nothing until GPU_HUB_IMAGE is set to a
# registry reference: without it the base compose default (local build)
# stays authoritative.

services:
  gpu-hub:
    image: ${GPU_HUB_IMAGE:?set GPU_HUB_IMAGE=<pinned digest ref> in .env}
    build: !reset null
