networks:
  net:
    driver: bridge

services:

  comfyui:
    image: comfyui-cpu
    container_name: comfyui-cpu
    restart: unless-stopped
    networks:
      - net
    volumes:
      # 🔥 МОДЕЛИ ЖИВУТ НА ХОСТЕ
      - /home/sureg/comfy/models:/app/models
    command:
      [
        "python",
        "main.py",
        "--cpu",
        "--listen",
        "0.0.0.0",
        "--port",
        "8188"
      ]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8188/system_stats')"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 40s


  backend:
    build: ./backend
    container_name: animastor-backend
    restart: unless-stopped
    networks:
      - net
    volumes:
      - ./workflow.json:/workflow.json:ro
    depends_on:
      comfyui:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3


  nginx:
    image: nginx:alpine
    container_name: nginx-animastor
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    networks:
      - net
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
