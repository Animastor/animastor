<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <!-- Favicons from website/logo.png: circular crop (same brand sign as the
       desktop header logo) for tabs, full-bleed square for iOS home screen. -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <title>Animastor Mobile</title>
  <script>
    // Apply theme before paint to avoid FOUC (mirrors Android applyTheme()).
    (function () {
      try {
        // Keep in sync with src/app/theme.ts (PREFS key + 'auto' hour rule).
        var PREFS = 'animastor_settings';
        var p = localStorage.getItem(PREFS) ? JSON.parse(localStorage.getItem(PREFS)) : {};
        var theme = p.theme || 'auto';
        var resolved = theme === 'auto'
          ? (new Date().getHours() >= 6 && new Date().getHours() <= 19 ? 'light' : 'dark')
          : theme;
        document.documentElement.setAttribute('data-theme', resolved);
        var lang = p.language || 'auto';
        if (lang === 'auto') lang = (navigator.language || 'en').indexOf('ru') === 0 ? 'ru' : 'en';
        document.documentElement.setAttribute('lang', lang);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <link rel="stylesheet" href="/src/styles/tokens.css" />
  <link rel="stylesheet" href="/src/styles/theme-dark.css" />
  <link rel="stylesheet" href="/src/styles/theme-light.css" />
  <link rel="stylesheet" href="/src/styles/base.css" />
</head>
<body>
  <div id="app"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
